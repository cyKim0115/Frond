[package]
name = "frond-core"
version = "0.1.0"
edition = "2021"
description = "Frond 바이트 보존 파일 코어 — 인코딩·BOM·줄바꿈을 원본 그대로 지키는 읽기/쓰기"
license = "MIT"
publish = false

[dependencies]
encoding_rs = "0.8.42"
chardetng = "1.0.0"
similar = "3.2.0"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization"] }

[dev-dependencies]
tempfile = "3.27.0"
