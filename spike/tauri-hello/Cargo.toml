[package]
name = "tauri-hello"
version = "0.1.0"
edition = "2021"
description = "Phase 0-3 startup/memory spike: minimal Tauri 2 hello window"
publish = false

[[bin]]
name = "tauri-hello"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.7.0"

[dependencies]
tauri = "2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
