[package]
name = "mdeditor"
version = "0.1.0"
description = "Markdown(.md) 파일을 보고 편집하는 개인용 Windows 데스크톱 앱"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mdeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdeditor-core = { path = "../crates/mdeditor-core" }
# 외부 변경 감지 (watch.rs)
notify-debouncer-full = "0.7.0"
blake3 = "1"
# 저장 인코딩 라벨(save.rs) — 코어와 같은 버전
encoding_rs = "0.8.42"
# 붙여넣은 이미지 헤더(assets.rs)
percent-encoding = "2"
# 파일 연결 (assoc.rs) · 관리자 권한 감지 (elevation.rs) · 설치 방식 판정 (install.rs)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
# 기본 오른쪽 클릭 메뉴의 인쇄를 앱 인쇄로 (print_menu.rs) — tauri(wry)가 쓰는 것과 같은 버전
webview2-com = "0.39"

[features]
# Store 공급자(license.rs) — R-3에서 StoreContext 호출을 넣을 자리. 지금은 켜도 판정이 같다
store = []

[dev-dependencies]
tempfile = "3.27.0"
