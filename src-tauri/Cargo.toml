[package]
name = "mdeditor"
version = "0.1.0"
description = "Markdown(.md) 파일을 보고 편집하는 개인용 Windows 데스크톱 앱"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mdeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdeditor-core = { path = "../crates/mdeditor-core" }
# 외부 변경 감지 (watch.rs)
notify-debouncer-full = "0.7.0"
blake3 = "1"
# 파일 연결 (assoc.rs)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
winreg = "0.55"
